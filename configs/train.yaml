data: data/casia_npy
subset_identities: 5000
images_per_identity: 50
image_size: 112
embedding_dim: 512
batch_size: 128
num_workers: 6
optimizer: sgd
lr: 0.05
momentum: 0.9
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 1
epochs: auto
arcface: {s: 64.0, m: 0.5, margin_warmup_epochs: 2}
amp: false
mps_memory_fraction: 0.7
grad_clip: 5.0
seed: 42
augment: true
lfw: data/eval/lfw.bin
eval_every_epochs: 2
eval_batch_size: 64
log_every: 20
